#############
# Bindings
#############

# Use shift + arrow key to move between windows in a session
bind -n S-Left  previous-window
bind -n S-Right next-window

# Use m to toggle mouse mode
# unbind m
# bind m setw mouse

# Setup 'v' to begin selection, just like Vim
bind-key -T copy-mode-vi 'v' send -X begin-selection

# 'y'/'Y' in copy-mode come from tmux-yank (OS clipboard + tmux buffer) — no manual bind needed here
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle
# bind C-l send-keys 'C-l'

# easy resize keys
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -L 5
bind h resize-pane -R 5

# bind-key C-l send-keys -R \; clear-history
# bind u send-keys C-l \; run-shell "sleep .3s" \; clear-history
# bind-key -n C-L send-keys C-l \; send-keys -R \; clear-history
bind  C-l send-keys C-l \; clear-history \; send-keys -R; 
bind -n C-k send-keys "echo 'Ctrl + l pressed'" Enter 

bind C-Y set-window-option synchronize-panes

#############################
############# Tmux Vars
#############################

# $(echo $USER) - shows the current username
# %a --> Day of week (Mon)
# %A --> Day of week Expanded (Monday)

# %b --> Month (Jan)
# %d --> Day (31)
# %Y --> Year (2017)

# %D --> Month/Day/Year (12/31/2017)
# %v --> Day-Month-Year (31-Dec-2017)

# %r --> Hour:Min:Sec AM/PM (12:30:27 PM)
# %T --> 24 Hour:Min:Sec (16:30:27)
# %X --> Hour:Min:Sec (12:30:27)
# %R --> 24 Hour:Min (16:30)
# %H --> 24 Hour (16)
# %l --> Hour (12)
# %M --> Mins (30)
# %S --> Seconds (09)
# %p --> AM/PM (AM)

# For a more complete list view: https://linux.die.net/man/3/strftime

#colour0 (black)
#colour1 (red)
#colour2 (green)
#colour3 (yellow)
#colour4 (blue)
#colour7 (white)
#colour5 colour6 colour7 colour8 colour9 colour10 colour11 colour12 colour13 colour14 colour15 colour16 colour17

#D ()
#F ()
#H (hostname)
#I (window index)
#P ()
#S (session index)
#T (pane title)
#W (currnet task like vim if editing a file in vim or zsh if running zsh)


#############################
########### Plugins
#############################
# tpm installs/updates plugins in ~/.tmux/plugins (prefix I = install, prefix U = update)
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-copycat'
# set -g @plugin 'tmux-plugins/tmux-open'
# set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
# set -g @plugin 'tmux-plugins/tmux-copycat'
# set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'sainnhe/tmux-fzf'           # fzf switcher (sessions/windows/panes) — prefix Tab
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'fcsonline/tmux-thumbs'      # quick pane/file hints — prefix Space
# tmux-fzf: launch with prefix + Tab instead of the default F
set-environment -g TMUX_FZF_LAUNCH_KEY 'Tab'
unbind F
# (CPU/RAM shown via /proc one-liners in status-right below; no build deps)
set -g @plugin 'roosta/tmux-fuzzback'


###############################################################
#                   Plugin Configurations                     #
###############################################################
set -g @fuzzback-bind E
set -g @fuzzback-popup 1
set -g @fuzzback-fzf-colors 'bg+:#100E23,gutter:#323F4E,pointer:#F48FB1,info:#ffe6b3,hl:#F48FB1,hl+:#63f2f1'
# Normally the fuzzback keybind will go into the prefix table, but if you want to activate fuzzback without typing the prefix, you can change the table here. Say you wanted to activate fuzzback without prefix:
set -g @fuzzback-table 'root'


set -g @resurrect-capture-pane-contents 'on'
# for vim
set -g @resurrect-strategy-vim 'session'

# tmux-continuum: auto save/restore (relies on resurrect)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @continuum-boot 'on'

# Tmux prefix highlight configurations
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=black,bg=yellow,bold' # default is 'fg=default,bg=yellow'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_sync_mode_attr 'fg=black,bg=green' # default is 'fg=default,bg=yellow'
set -g @prefix_highlight_prefix_prompt ' Wait '
set -g @prefix_highlight_copy_prompt ' Copy '
set -g @prefix_highlight_sync_prompt ' Sync '
set -g @prefix_highlight_empty_prompt '        '          # default is '' (empty char)
set -g @prefix_highlight_empty_attr 'fg=default,bg=green' # default is 'fg=default,bg=default'
set -g @prefix_highlight_empty_has_affixes 'on' # default is 'off'
set -g @prefix_highlight_empty_prompt 'Tmux'
set -g @prefix_highlight_fg 'white' # default is 'colour231'
set -g @prefix_highlight_bg 'blue'  # default is 'colour04'
# set -g @prefix_highlight_output_prefix ' '
# set -g @prefix_highlight_output_suffix ' '

# Send the same command to all panes/windows/sessions
bind E command-prompt -p "Command:" \
	 "run \"tmux list-panes -a -F '##{session_name}:##{window_index}.##{pane_index}' \
				| xargs -I PANE tmux send-keys -t PANE '%1' Enter\""

# NOTE: commented out — these created a brand-new session every time the conf was sourced

# tpm loads every @plugin above — this line must stay LAST
run '~/.tmux/plugins/tpm/tpm'
