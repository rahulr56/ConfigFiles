# set -g pane-active-border-fg colour8
set -g pane-border-style fg=colour8

# force a reload of the config file
bind ^t source-file ~/.tmux.conf
set -g status on

# splitting and moving
bind ^h select-pane -L
bind ^j select-pane -D
bind ^k select-pane -U
bind ^L select-pane -R
bind ^g split-window -h -c '#{pane_current_path}'
bind ^v split-window -v -c '#{pane_current_path}'

# scrolling
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

# vim keybindings in copy mode
setw -g mode-keys vi
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
bind p paste-buffer

# not sure what this does
set -g status-right ''

# send pane to another window
bind-key s command-prompt -p "send pane to:" "join-pane -t ':%%'"

# Send the same command to all panes/windows/sessions
bind E command-prompt -p "Command:" \
	 "run \"~/.local/appimages/tmux.appimage list-panes -a -F '##{session_name}:##{window_index}.##{pane_index}' \
				| xargs -I PANE ~/.local/appimages/tmux.appimage send-keys -t PANE '%1' Enter\""

# for alerts
set-window-option -g visual-bell on
set-option -g visual-bell off

# Set the history limit so we get lots of scrollback.
set -g history-limit 999999999

