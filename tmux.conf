# set -g pane-active-border-fg colour8
set -g pane-border-style fg=colour8

# force a reload of the config file
bind ^t source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
set -g status on

# splitting and moving
bind ^h select-pane -L
bind ^j select-pane -D
bind ^k select-pane -U
bind ^L select-pane -R
bind ^g split-window -h -c '#{pane_current_path}'
bind ^v split-window -v -c '#{pane_current_path}'

# scrolling
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

# vim keybindings in copy mode
setw -g mode-keys vi
unbind -T copy-mode-vi Enter
bind p paste-buffer

# not sure what this does
set -g status-right ''

# send pane to another window
bind-key s command-prompt -p "send pane to:" "join-pane -t ':%%'"

# Send the same command to all panes/windows/sessions
bind E command-prompt -p "Command:" \
	 "run \"~/.local/appimages/tmux.appimage list-panes -a -F '##{session_name}:##{window_index}.##{pane_index}' \
				| xargs -I PANE ~/.local/appimages/tmux.appimage send-keys -t PANE '%1' Enter\""

# for alerts
set-window-option -g visual-bell on
set-option -g visual-bell off

# Set the history limit so we get lots of scrollback.
set -g history-limit 999999999

# QoL (quality of life)
set -g escape-time 0                            # instant ESC (vim inside tmux)
set -g focus-events on                          # let vim/neovim track focus
set -g renumber-windows on                      # renumber windows when one closes
set -as terminal-features 'xterm-256color:RGB'  # 24-bit colour passthrough (tmux 3.2+)
setw -g monitor-activity on                     # mark [activity] in window list
set -g visual-activity off                      # ...but no status-line popup
bind c new-window -c '#{pane_current_path}'     # new window inherits cwd

